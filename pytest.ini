# Configuration pytest.
#
# La suite ne charge JAMAIS torch ni les modèles réels (voir
# compteur/detecteur.py : imports paresseux ; faux backends dans les tests).
# Elle est donc rapide par nature : itérer sur un seul fichier prend des
# secondes. La méthode de travail est documentée dans README.md (section
# « Tests ») et dans ETAT_PROJET.md (note locale) :
#
#     pytest tests/test_ligne.py        # itération sur un module (secondes)
#     pytest -m "not slow"              # passe rapide, sans les lourds
#     pytest                            # suite complète (avant chaque push)
#     pytest -n auto                    # suite complète en parallèle (pytest-xdist)
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    slow: tests lourds (sous-processus, démarrages complets) — à relire avant un push, pas à chaque itération
